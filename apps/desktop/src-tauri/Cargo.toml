[package]
name = "clover-desktop"
version = "0.1.0"
description = "Clover — photograph it, it's for sale."
authors = ["Clover"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "clover_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"
