[package]
name = "clover-desktop"
version = "0.1.0"
description = "Clover — photograph it, it's for sale."
authors = ["Clover"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "clover_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2", optional = true }
url = "2"

[features]
default = []
# Enabled by the release workflow when an updater key pair is configured (see docs/runbooks/native-apps.md).
updater = ["dep:tauri-plugin-updater"]
