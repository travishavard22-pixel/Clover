<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Clover</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: -apple-system, system-ui, sans-serif; background: #f8f7f3; color: #1d1f1c; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #151714; color: #f2f1ec; } }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0; opacity: 0.7; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Clover needs a connection</h1>
      <p>The app loads from your Clover server. Check your internet connection and reopen the app.</p>
    </main>
  </body>
</html>
