services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clover
      POSTGRES_PASSWORD: clover
      POSTGRES_DB: clover
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clover"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://clover:clover@db:5432/clover
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage
      CLOVER_INLINE_WORKER: "0"
    ports: ["3000:3000"]
    volumes: [storage:/app/storage]

  worker:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://clover:clover@db:5432/clover
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage
    command: ["pnpm", "exec", "tsx", "scripts/worker.ts"]
    volumes: [storage:/app/storage]

volumes:
  pgdata:
  storage:
