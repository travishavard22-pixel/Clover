name: Mobile builds

# Android: a debug APK you can install on a phone straight from the workflow artifacts.
# iOS: a simulator build to prove the project compiles; device and App Store builds need an Apple
# Developer account and signing, which is described in docs/runbooks/native-apps.md.
# Set the repository variable CLOVER_APP_URL to your hosted address first.

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CLOVER_APP_URL: ${{ vars.CLOVER_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
        working-directory: apps/mobile
      - run: pnpm exec cap sync android
        working-directory: apps/mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: clover-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    runs-on: macos-latest
    env:
      CLOVER_APP_URL: ${{ vars.CLOVER_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
        working-directory: apps/mobile
      - name: Create the iOS project when it is not committed
        run: test -d ios || pnpm exec cap add ios
        working-directory: apps/mobile
      - run: pnpm exec cap sync ios
        working-directory: apps/mobile
      - name: Build for the simulator (no signing required)
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO | xcpretty || xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
        working-directory: apps/mobile
